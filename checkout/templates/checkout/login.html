<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Checkout — Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --ink: #1F1B16; --paper: #FBF4E8; --ember: #E8590C; --clay: #B23A2E; }
        * { box-sizing: border-box; }
        body {
            margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center;
            background: var(--paper); font-family: 'Inter', sans-serif;
        }
        .card {
            background: #fff; padding: 48px 44px; border-radius: 6px; width: 380px;
            box-shadow: 0 8px 28px rgba(31,27,22,0.14); border-top: 5px solid var(--ember);
        }
        h1 {
            font-family: 'Oswald', sans-serif; color: var(--ink); font-size: 26px; font-weight: 700;
            letter-spacing: 0.5px; text-transform: uppercase; margin: 0 0 4px 0; text-align: center;
        }
        h1 span { color: var(--ember); }
        p.subtitle { color: #8a8276; text-align: center; margin: 0 0 32px 0; font-size: 14px; }
        input {
            width: 100%; padding: 14px 16px; margin-bottom: 14px; border-radius: 6px;
            border: 1.5px solid #e3dccb; background: var(--paper); color: var(--ink);
            font-size: 16px; font-family: 'Inter', sans-serif;
        }
        input:focus { outline: none; border-color: var(--ember); }
        button {
            width: 100%; padding: 15px; border-radius: 6px; border: none; background: var(--ember);
            color: #fff; font-family: 'Oswald', sans-serif; font-size: 16px; font-weight: 600;
            letter-spacing: 0.5px; text-transform: uppercase; cursor: pointer;
        }
        button:hover { background: #d14f0a; }
        .error { color: var(--clay); text-align: center; margin-bottom: 16px; font-size: 14px; font-weight: 500; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Check<span>•</span>Out</h1>
        <p class="subtitle">RestaurantFlow Cashier</p>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <form method="post">
            {% csrf_token %}
            {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
            <input type="text" name="username" placeholder="Username" autofocus required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Log In</button>
        </form>
    </div>
</body>
</html>
