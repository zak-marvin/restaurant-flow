<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% if item %}Edit{% else %}Add{% endif %} Meal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --ink: #1F1B16; --paper: #FBF4E8; --ember: #E8590C; --basil: #2F6B3C; --clay: #B23A2E; --steel: #4A5A66; }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--paper); font-family: 'Inter', sans-serif; color: var(--ink); }
        header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 18px 32px; background: var(--ink); border-bottom: 4px solid var(--ember);
        }
        .wordmark { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: 0.5px; color: var(--paper); text-transform: uppercase; }
        .wordmark span { color: var(--ember); }
        header a { color: var(--paper); text-decoration: none; font-size: 14px; font-weight: 500; }

        .form-card {
            max-width: 560px; margin: 32px auto; background: #fff; border-radius: 8px;
            box-shadow: 0 3px 14px rgba(31,27,22,0.1); padding: 32px; border-top: 4px solid var(--ember);
        }
        label { display: block; font-family: 'Oswald', sans-serif; font-size: 13px; font-weight: 600;
            letter-spacing: 0.3px; text-transform: uppercase; color: var(--steel); margin: 16px 0 6px 0; }
        input[type="text"], input[type="number"], textarea, select {
            width: 100%; padding: 11px 12px; border-radius: 6px; border: 1.5px solid #e3dccb;
            background: var(--paper); color: var(--ink); font-size: 15px; font-family: 'Inter', sans-serif;
        }
        textarea { resize: vertical; min-height: 70px; }
        input:focus, textarea:focus, select:focus { outline: none; border-color: var(--ember); }

        .allergen-grid { display: flex; flex-wrap: wrap; gap: 10px; }
        .allergen-chip {
            display: flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 18px;
            background: var(--paper); border: 1.5px solid #e3dccb; font-size: 13px; cursor: pointer;
        }
        .allergen-chip input { width: auto; margin: 0; }

        .checkbox-row { display: flex; align-items: center; gap: 8px; margin-top: 16px; }
        .checkbox-row input { width: auto; }
        .checkbox-row label { margin: 0; font-family: 'Inter', sans-serif; text-transform: none; font-weight: 500; letter-spacing: 0; color: var(--ink); }

        .photo-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
        .photo-thumb { position: relative; width: 90px; height: 90px; border-radius: 6px; overflow: hidden; }
        .photo-thumb img { width: 100%; height: 100%; object-fit: cover; }
        .photo-thumb button {
            position: absolute; top: 2px; right: 2px; background: var(--clay); color: #fff; border: none;
            border-radius: 50%; width: 22px; height: 22px; font-size: 12px; cursor: pointer; line-height: 1;
        }

        .error { color: var(--clay); font-weight: 500; margin-top: 12px; }
        .submit-btn {
            width: 100%; margin-top: 26px; padding: 14px; border: none; border-radius: 6px;
            background: var(--ember); color: #fff; font-family: 'Oswald', sans-serif; font-size: 15px;
            font-weight: 600; letter-spacing: 0.4px; text-transform: uppercase; cursor: pointer;
        }
        .submit-btn:hover { background: #d14f0a; }
    </style>
</head>
<body>
    <header>
        <div class="wordmark">Chef<span>•</span>Menu</div>
        <a href="{% url 'chef_board' %}">← Back to menu</a>
    </header>

    <div class="form-card">
        <h2 style="font-family:'Oswald',sans-serif; margin-top:0;">{% if item %}Edit Meal{% else %}Add New Meal{% endif %}</h2>

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}

            <label>Meal name</label>
            <input type="text" name="name" value="{{ item.name|default:'' }}" required>

            <label>Description</label>
            <textarea name="description">{{ item.description|default:'' }}</textarea>

            <label>Price (UGX)</label>
            <input type="number" name="price" step="1" min="0" value="{{ item.price|default:'' }}" required>

            <label>Category</label>
            <select name="category" required>
                {% for category in categories %}
                <option value="{{ category.id }}" {% if item and item.category_id == category.id %}selected{% endif %}>{{ category.name }}</option>
                {% endfor %}
            </select>

            <label>Allergens</label>
            <div class="allergen-grid">
                {% for allergen in allergens %}
                <label class="allergen-chip">
                    <input type="checkbox" name="allergens" value="{{ allergen.id }}"
                           {% if allergen.id in selected_allergen_ids %}checked{% endif %}>
                    {{ allergen.name }}
                </label>
                {% endfor %}
            </div>

            <div class="checkbox-row">
                <input type="checkbox" name="available" id="available" {% if not item or item.available %}checked{% endif %}>
                <label for="available">Available on the menu right now</label>
            </div>

            <label>Add photos</label>
            <input type="file" name="photos" accept="image/*" multiple>

            {% if item and item.images.all %}
            <label>Current photos</label>
            <div class="photo-row">
                {% for photo in item.images.all %}
                <div class="photo-thumb">
                    <img src="{{ photo.image.url }}" alt="">
                    <form method="post" action="{% url 'chef_photo_delete' photo.id %}"
                          onsubmit="return confirm('Remove this photo?');">
                        {% csrf_token %}
                        <button type="submit" title="Remove photo">×</button>
                    </form>
                </div>
                {% endfor %}
            </div>
            {% endif %}

            {% if error %}<div class="error">{{ error }}</div>{% endif %}

            <button type="submit" class="submit-btn">{% if item %}Save Changes{% else %}Add Meal{% endif %}</button>
        </form>
    </div>
</body>
</html>
